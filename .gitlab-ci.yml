---
stages:
  - test
  - build
  - post-test

variables:
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_DEPTH: "1"

include:
  - component: $CI_SERVER_FQDN/ci/security/bundle@1
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs: &build-inputs
      name: alpine-tag
      build_needs:
        - job: detect version
          artifacts: true
      image: derper-alpine
      tags: $DERP_TAGS
      dockerfile: Dockerfile
      build_args: --build-arg TAILSCALE_CHANNEL=tag --build-arg PATCH_VARIANT=light
      architectures: linux/amd64,linux/arm64
      scan_tag: latest
      rules_changes:
        - Dockerfile
        - .dockerignore
        - LICENSE.md
        - src/entrypoint.sh
        - .containerignore
        - .gitmodules
        - src/apply-patches.sh
        - src/patches/**/*
        - src/tailscale
        - src/tailscale-main
        - .gitlab-ci.yml
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: alpine-main
      build_args: --build-arg TAILSCALE_CHANNEL=main --build-arg TAILSCALE_REVISION=$DERP_MAIN_REVISION
      tags: main
      scan_tag: main
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: alpine-tag-performance
      build_args: --build-arg PATCH_VARIANT=performance
      tags: $DERP_PERFORMANCE_TAGS
      scan_tag: performance
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: alpine-main-performance
      build_args: --build-arg TAILSCALE_CHANNEL=main --build-arg PATCH_VARIANT=performance --build-arg TAILSCALE_REVISION=$DERP_MAIN_REVISION
      tags: main-performance
      scan_tag: main-performance
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: fedora-tag
      build_args: --build-arg RUNTIME_IMAGE=docker.io/library/fedora:44
      image: derper-fedora
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: fedora-main
      build_args: --build-arg RUNTIME_IMAGE=docker.io/library/fedora:44 --build-arg TAILSCALE_CHANNEL=main --build-arg TAILSCALE_REVISION=$DERP_MAIN_REVISION
      image: derper-fedora
      tags: main
      scan_tag: main
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: fedora-tag-performance
      build_args: --build-arg RUNTIME_IMAGE=docker.io/library/fedora:44 --build-arg PATCH_VARIANT=performance
      image: derper-fedora
      tags: $DERP_PERFORMANCE_TAGS
      scan_tag: performance
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: fedora-main-performance
      build_args: --build-arg RUNTIME_IMAGE=docker.io/library/fedora:44 --build-arg TAILSCALE_CHANNEL=main --build-arg PATCH_VARIANT=performance --build-arg TAILSCALE_REVISION=$DERP_MAIN_REVISION
      image: derper-fedora
      tags: main-performance
      scan_tag: main-performance

detect version:
  stage: test
  image: docker.io/library/alpine:3
  script:
    - apk add --no-cache git
    - |
      VERSION="$(cat src/tailscale/VERSION.txt)"
      MAJOR="${VERSION%%.*}"
      MINOR="${VERSION%.*}"
      DERP_TAGS="latest,$MAJOR,$MINOR,$VERSION"
      DERP_PERFORMANCE_TAGS="performance,latest-performance,$MAJOR-performance,$MINOR-performance,$VERSION-performance"
      printf 'DERP_TAGS=%s\nDERP_PERFORMANCE_TAGS=%s\n' "$DERP_TAGS" "$DERP_PERFORMANCE_TAGS" > derp.env
    - printf 'DERP_MAIN_REVISION=%s\n' "$(git -C src/tailscale-main rev-parse --short=12 HEAD)" >> derp.env
    - cat derp.env
  artifacts:
    reports:
      dotenv: derp.env
  rules:
    - when: on_success
