---
stages:
  - test
  - build
  - post-test

variables:
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_DEPTH: "1"

include:
  - component: $CI_SERVER_FQDN/ci/security/bundle@1
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs: &build-inputs
      name: alpine-tag
      build_needs:
        - job: detect version
          artifacts: true
      image: derper-alpine
      tags: latest,$DERP_TAGS
      architectures: linux/amd64,linux/arm64
      rules_changes:
        - Dockerfile
        - .containerignore
        - LICENSE.md
        - src/**/*
        - .gitlab-ci.yml
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: alpine-main
      build_args: --build-arg TAILSCALE_CHANNEL=main --build-arg TAILSCALE_REVISION=$DERP_MAIN_REVISION
      tags: main
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: alpine-tag-performance
      build_args: --build-arg PATCH_VARIANT=performance
      tags: performance,latest-performance,$DERP_PERFORMANCE_TAGS
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: alpine-main-performance
      build_args: --build-arg TAILSCALE_CHANNEL=main --build-arg PATCH_VARIANT=performance --build-arg TAILSCALE_REVISION=$DERP_MAIN_REVISION
      tags: main-performance
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: fedora-tag
      build_args: --build-arg RUNTIME=fedora
      image: derper-fedora
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: fedora-main
      build_args: --build-arg RUNTIME=fedora --build-arg TAILSCALE_CHANNEL=main --build-arg TAILSCALE_REVISION=$DERP_MAIN_REVISION
      image: derper-fedora
      tags: main
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: fedora-tag-performance
      build_args: --build-arg RUNTIME=fedora --build-arg PATCH_VARIANT=performance
      image: derper-fedora
      tags: performance,latest-performance,$DERP_PERFORMANCE_TAGS
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      <<: *build-inputs
      name: fedora-main-performance
      build_args: --build-arg RUNTIME=fedora --build-arg TAILSCALE_CHANNEL=main --build-arg PATCH_VARIANT=performance --build-arg TAILSCALE_REVISION=$DERP_MAIN_REVISION
      image: derper-fedora
      tags: main-performance

detect version:
  stage: test
  image: docker.io/library/alpine:3
  script:
    - apk add --no-cache git
    - |
      VERSION="$(cat src/tailscale/VERSION.txt)"
      MAJOR="${VERSION%%.*}"
      MINOR="${VERSION%.*}"
      REVISION="$(git -C src/tailscale-main rev-parse --short=12 HEAD)"
      printf 'DERP_TAGS=%s\nDERP_PERFORMANCE_TAGS=%s\nDERP_MAIN_REVISION=%s\n' "$MAJOR,$MINOR,$VERSION" "$MAJOR-performance,$MINOR-performance,$VERSION-performance" "$REVISION" > derp.env
    - cat derp.env
  artifacts:
    reports:
      dotenv: derp.env
  rules:
    - when: on_success
