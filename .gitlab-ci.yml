---
stages:
  - test
  - build
  - post-test

include:
  - component: $CI_SERVER_FQDN/ci/security/bundle@1
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      name: alpine
      build_needs:
        - job: detect version
          artifacts: true
      image: derper-alpine
      tags: $DERP_TAGS
      dockerfile: Dockerfile.alpine
      patches_dir: src/patches
      patches_target: src/tailscale
      architectures: linux/amd64,linux/arm64
      scan_tag: latest
      rules_changes:
        - Dockerfile.alpine
        - Dockerfile.fedora
        - .containerignore
        - src/patches/**/*
        - src/tailscale
        - .gitlab-ci.yml
  - component: $CI_SERVER_FQDN/ci/docker/build-and-scan@4
    inputs:
      name: fedora
      build_needs:
        - job: detect version
          artifacts: true
      image: derper-fedora
      tags: $DERP_TAGS
      dockerfile: Dockerfile.fedora
      patches_dir: src/patches
      patches_target: src/tailscale
      architectures: linux/amd64,linux/arm64
      scan_tag: latest
      rules_changes:
        - Dockerfile.alpine
        - Dockerfile.fedora
        - .containerignore
        - src/patches/**/*
        - src/tailscale
        - .gitlab-ci.yml

.fetch-submodule: &fetch-submodule
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: "1"

detect version:
  stage: test
  image: docker.io/library/alpine:3
  <<: *fetch-submodule
  script:
    - |
      VERSION="$(cat src/tailscale/VERSION.txt)"
      MAJOR="$(echo "$VERSION" | cut -d. -f1)"
      MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
      DERP_TAGS="latest,$MAJOR,$MINOR,$VERSION"
      echo "Tailscale (pinned submodule): $VERSION"
      echo "Generated tags: $DERP_TAGS"
      echo "DERP_TAGS=$DERP_TAGS" > derp.env
    - cat derp.env
  artifacts:
    reports:
      dotenv: derp.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile.alpine
        - Dockerfile.fedora
        - .containerignore
        - src/patches/**/*
        - src/tailscale
        - .gitlab-ci.yml

build alpine:
  <<: *fetch-submodule

build fedora:
  <<: *fetch-submodule
